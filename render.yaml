services:
  - type: web
    name: jaipuria-moodle-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MCP_ADMIN_TOKEN
        sync: false
      - key: MCP_TOKENS
        sync: false
      - key: MCP_SERVER_BASE_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_ALLOWED_DOMAINS
        value: jaipuria.ac.in
      - key: OAUTH_DEFAULT_CAMPUSES
        value: all
      - key: MCP_FACULTY
        sync: false
      - key: OAUTH_JWT_SIGNING_KEY
        sync: false
      - key: AGENT_API_BASE
        value: https://reports.tryrehearsal.ai
      - key: AGENT_ADMIN_USER
        sync: false
      - key: AGENT_ADMIN_PASS
        sync: false
      - key: REPORT_PUBLIC_BASE_URL
        value: https://reports.tryrehearsal.ai
