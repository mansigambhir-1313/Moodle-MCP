name: keep-warm

# Pings the public /health endpoint so the Render free-tier instance does not
# spin down — faculty never hit a 30–60s cold start on the first query.
# /health is unauthenticated and returns only {"status":"ok"} (no data, no token),
# so this is safe to run from a public workflow with no secrets.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}        # allow a manual run from the Actions tab

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          set -euo pipefail
          URL="https://moodle-mcp-f6do.onrender.com/health"
          # Retry to cover a cold start (free tier can take ~30–60s to wake).
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 "$URL" || echo 000)
            body=$(cat /tmp/body 2>/dev/null || true)
            echo "attempt $i -> HTTP $code  body=$body"
            if [ "$code" = "200" ]; then
              echo "awake ✓"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health did not return 200 after retries"
          exit 1
