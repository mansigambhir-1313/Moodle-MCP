name: ci

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # runner.* is not available while GitHub validates job-level env.
      FASTMCP_HOME: /tmp/moodle-fastmcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate Codex packaging
        run: python scripts/validate_codex_packaging.py
      - name: Run isolated repository checks
        run: |
          set -euo pipefail
          for test_file in \
            tests/test_faculty_registry.py \
            tests/test_client_wiring.py \
            tests/test_create_report_scoping.py \
            tests/test_scope_normalizer.py \
            tests/test_data_fixes.py \
            tests/test_hardening.py
          do
            python "$test_file"
          done
